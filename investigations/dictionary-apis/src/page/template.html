<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dictionary API Comparison</title>
<style>
  :root {
    --bg: #fbfbf9; --fg: #1d1d1b; --muted: #6b6b66; --line: #deded8; --head: #f0f0ea;
    --accent: #2f5d8a; --warn-bg: #fff4dc; --warn-fg: #7a4d00; --bad: #a3321f; --ok: #2f6b3a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a19; --fg: #e8e8e3; --muted: #9c9c95; --line: #3a3a37; --head: #262624;
      --accent: #8db5dd; --warn-bg: #3a2f17; --warn-fg: #f1cf8a; --bad: #ef8f7d; --ok: #8fcf9b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  h2 { font-size: 20px; margin: 40px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  a { color: var(--accent); }
  .meta { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
  .callout { background: var(--warn-bg); color: var(--warn-fg); border-radius: 6px; padding: 10px 14px; margin: 12px 0; }
  .callout ul { margin: 4px 0 0; padding-left: 20px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .card h3 { font-size: 16px; margin: 0 0 4px; }
  .card p { margin: 4px 0; }
  .card .note { color: var(--muted); font-size: 13px; }
  .badge { display: inline-block; font-size: 12px; line-height: 1; padding: 4px 7px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--head); white-space: nowrap; }
  .badge.manual { background: var(--warn-bg); color: var(--warn-fg); border-color: transparent; font-weight: 600; }
  .badge.none { color: var(--ok); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
  thead th { position: sticky; top: 0; background: var(--head); z-index: 1; white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; }
  td.c, th.c { text-align: center; }
  td.word { font-weight: 600; white-space: nowrap; }
  .results table { table-layout: fixed; }
  .results col.w { width: 150px; } .results col.a { width: 118px; } .results col.t { width: 74px; }
  .na, .dash { color: var(--muted); }
  .err { color: var(--bad); }
  .skip { color: var(--muted); font-style: italic; }
  .extra { color: var(--muted); font-size: 13px; }
  audio { width: 104px; height: 28px; }
  details.provider { border: 1px solid var(--line); border-radius: 8px; margin: 10px 0; }
  details.provider > summary { cursor: pointer; padding: 10px 14px; font-weight: 600; }
  details.provider > summary .sum { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 8px; }
  details.provider > .table-wrap { padding: 0 8px 8px; }
  details.more summary { cursor: pointer; color: var(--accent); font-size: 13px; }
  ol.defs { margin: 4px 0 0; padding-left: 20px; }
  .legend { color: var(--muted); font-size: 13px; }
  .rejected li { margin: 2px 0; }
</style>
</head>
<body>
<main>
  <h1>Dictionary API comparison</h1>
  <p class="meta"><!--META--></p>
  <!--ISSUES-->

  <h2 id="descriptions">Descriptions</h2>
  <div class="cards"><!--DESCRIPTIONS--></div>

  <h2 id="cost">Cost &amp; limits</h2>
  <div class="table-wrap"><!--COST--></div>

  <h2 id="results">Results</h2>
  <p class="legend">
    <b>🔊🇬🇧</b> / <b>🔊🇺🇸</b> British / American pronunciation audio ·
    <b>🇬🇧 t</b> / <b>🇺🇸 t</b> time to fetch that audio file (ms) ·
    <b>def t</b> time for the definition request (ms) ·
    <span class="dash">—</span> this word came back without it ·
    <span class="na">n/a</span> the API has no such dialect at all.
  </p>
  <div class="results"><!--RESULTS--></div>
  <!--REJECTED-->
</main>
</body>
</html>
