<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Vocabulary — 1 word</title>
<style>STYLE</style>
<script type="module" src="/assets/page.js"></script>
</head>
<body>
<main data-session="SESSION" data-rev="0" data-max-rows="500">
<header class="title"><h1>Vocabulary</h1><span class="meta-short">1 word · DATES</span></header>
<p class="meta">1 word · DATES</p>
<p class="actions"><a class="btn" href="/s/SESSION/words.txt" download>Download for AnkiDroid</a><a class="btn learn" href="/s/SESSION/learn">Learn</a></p>
<div class="layout">
<div class="table-area">
<div class="table-scroll">
<table>
<thead><tr><th class="n" scope="col">#</th><th class="c-word" scope="col">Word</th><th class="c-translation" scope="col">Translation</th><th class="c-definition" scope="col">Definition</th></tr></thead>
<tbody>
<tr data-row="ROW"><td class="n"><button type="button" class="del" aria-label="Delete this row">×</button></td><td class="c-word" data-field="word" data-rev="0"><div class="v">apple</div><p class="needs-word-mark">not in the download — needs a word</p></td><td class="c-translation" data-field="translation" data-rev="0"><div class="v">яблуко</div></td><td class="c-definition" data-field="definition" data-rev="0"><div class="v">a fruit</div></td></tr>
</tbody>
</table>
<template id="blank-row"><tr data-row=""><td class="n"><button type="button" class="del" aria-label="Delete this row">×</button></td><td class="c-word" data-field="word" data-rev="0"><div class="v"></div><p class="needs-word-mark">not in the download — needs a word</p></td><td class="c-translation" data-field="translation" data-rev="0"><div class="v"></div></td><td class="c-definition" data-field="definition" data-rev="0"><div class="v"></div></td></tr></template>
</div>
<p class="add-row"><button type="button" class="add">+ Add a word</button></p>
<p class="credit">Definitions: Merriam-Webster</p>
</div>

</div>
<div class="toasts" aria-live="polite"></div>
</main>
</body>
</html>
