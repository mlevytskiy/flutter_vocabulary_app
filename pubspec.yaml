name: flutter_vocabulary_app
description: A Flutter app for learning English words with translations
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  translator: ^1.0.0
  lottie: ^3.3.3
  http: ^1.6.0
  popup_menu_2: ^0.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
