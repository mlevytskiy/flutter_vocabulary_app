name: flutter_vocabulary_app
description: A Flutter app for learning English words with translations
publish_to: 'none'
version: 1.1.0+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  translator: ^1.0.0
  popup_menu_2: ^0.1.7
  share_plus: ^7.2.1
  flutter_speed_dial: ^7.0.0
  image_picker: ^1.1.2
  # Direct only to set useAndroidPhotoPicker in main.dart (photo-from-gallery ADR-0001).
  image_picker_android: ^0.8.13
  image_picker_platform_interface: ^2.11.1
  http: ^1.2.2
  flutter_image_compress: ^2.5.1
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.0
  # go_router stays on 17.x: 18 only recognises material_ui's MaterialApp and,
  # with flutter/material.dart's, builds NoTransitionPage (no slide, no iOS
  # back swipe). See docs/architecture.md rule 6.
  go_router: ^17.5.0
  shared_preferences: ^2.5.5
  flutter_tts: ^4.2.5
  # isar_community pinned exactly to 3.4.1 (toolchain-upgrade, owner 2026-10-24):
  # built against build ^4 / source_gen ^4 like riverpod_generator 4.x and
  # go_router_builder 4.x. Pinned so a `pub upgrade` cannot drift the database
  # format or the generator. See docs/architecture.md rule 6.
  isar_community: 3.4.1
  isar_community_flutter_libs: 3.4.1
  path_provider: ^2.1.0
  url_launcher: 6.3.1
  file_selector: ^1.1.0
  webview_flutter: ^4.13.1
  # The glass behind photo panel look A (owner, 2026-10-13). Pinned: only dev
  # releases exist and their API moves between them. Real refraction on
  # Impeller; on Skia (and in widget tests) it falls back to a blur.
  liquid_glass_renderer: 0.2.0-dev.4
  # The PDF share format (owner, 2026-10-14). Pinned, pure Dart.
  pdf: 3.11.3
  # Speech to text for Talk with AI (learn-redesign, owner 2026-10-23/24). Pinned.
  speech_to_text: 7.5.0
  # Second speech engine for Talk with AI, picked in Learn settings (learn-redesign, owner 2026-10-23/24). Pinned.
  speech_to_text_pro: 0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^4.0.0
  build_runner: ^2.16.0
  go_router_builder: ^4.0.0
  isar_community_generator: 3.4.1

flutter:
  uses-material-design: true
  # The PDF export's font: the PDF base fonts have no Cyrillic.
  assets:
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/licenses/
  # The app themes' fonts (app-themes, owner 2026-10-17); OFL, licences in
  # assets/fonts/licenses, registered in main.dart.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-Regular.ttf
        - asset: assets/fonts/Unbounded-Medium.ttf
          weight: 500
        - asset: assets/fonts/Unbounded-Bold.ttf
          weight: 700
    - family: Comfortaa
      fonts:
        - asset: assets/fonts/Comfortaa-Regular.ttf
        - asset: assets/fonts/Comfortaa-Medium.ttf
          weight: 500
        - asset: assets/fonts/Comfortaa-Bold.ttf
          weight: 700
