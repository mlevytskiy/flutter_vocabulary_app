name: flutter_vocabulary_app
description: A Flutter app for learning English words with translations
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  translator: ^1.0.0
  popup_menu_2: ^0.1.7
  share_plus: ^7.2.1
  flutter_speed_dial: ^7.0.0
  screenshot: ^3.0.0
  image_picker: ^1.1.2
  http: ^1.2.2
  flutter_image_compress: ^2.5.1
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^17.2.3
  shared_preferences: ^2.5.5
  flutter_tts: ^4.2.5
  # isar_community pinned to 3.3.0-dev.1: it is the newest release still built
  # against build 2.x / source_gen 2.x. Every later version (>=3.3.0-dev.2)
  # requires build ^3/^4, which collides with riverpod_generator 2.x and
  # go_router_builder 3.x. See docs/architecture.md rule 6.
  isar_community: 3.3.0-dev.1
  isar_community_flutter_libs: 3.3.0-dev.1
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.6.1
  build_runner: ^2.4.13
  go_router_builder: ^3.0.0
  isar_community_generator: 3.3.0-dev.1

flutter:
  uses-material-design: true
